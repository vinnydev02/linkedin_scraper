[project]
name = "linkedin-scraper-api"
version = "0.1.0"
description = "A small FastAPI service for collecting LinkedIn post URLs with Playwright."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.115.0",
    "playwright>=1.50.0",
    "pydantic>=2.8.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py311"
